name: Interpreter Live iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: interpreter-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Test new WAV and dedicated translation protocol
        run: |
          swiftc Live/TranslationWire.swift Live/PartnerLanguage.swift Live/ImportedAudio.swift Live/TranscriptionWire.swift Live/VoiceSynthesisLanguage.swift Live/VoiceReferenceClip.swift LiveTests/test_wire.swift -o "$RUNNER_TEMP/live-wire-tests"
          "$RUNNER_TEMP/live-wire-tests"
      - name: Test streamed PCM integrity
        run: |
          swiftc Live/StreamAudioIntegrity.swift LiveTests/test_stream_audio_integrity.swift -o "$RUNNER_TEMP/live-stream-tests"
          "$RUNNER_TEMP/live-stream-tests"
      - name: Test safe trimming of digital silence
        run: |
          swiftc Live/DigitalSilenceCompactor.swift LiveTests/test_silence_compactor.swift -o "$RUNNER_TEMP/live-silence-tests"
          "$RUNNER_TEMP/live-silence-tests"
      - name: Test enhanced replay with unmodified raw audio
        run: |
          swiftc Live/TranslationWire.swift Live/DigitalSilenceCompactor.swift Live/TranslationPlaybackAudio.swift LiveTests/test_playback_audio.swift -o "$RUNNER_TEMP/live-audio-playback-tests"
          "$RUNNER_TEMP/live-audio-playback-tests"
      - name: Test non-invasive microphone level measurements
        run: |
          swiftc Live/InputAudioLevelMeter.swift LiveTests/test_input_audio_levels.swift -o "$RUNNER_TEMP/input-level-tests"
          "$RUNNER_TEMP/input-level-tests"
      - name: Test timestamped audio delta diagnostic report
        run: |
          swiftc Live/InputAudioLevelMeter.swift Live/TranslationEventDiagnostics.swift LiveTests/test_translation_event_diagnostics.swift -o "$RUNNER_TEMP/live-event-diagnostics-tests"
          "$RUNNER_TEMP/live-event-diagnostics-tests"
      - name: Test Russian proofreading and translation routing
        run: |
          swiftc Live/VoiceSynthesisLanguage.swift Live/VoiceTextProcessingPolicy.swift LiveTests/test_proofreading.swift -o "$RUNNER_TEMP/live-proofreading-tests"
          "$RUNNER_TEMP/live-proofreading-tests"
      - name: Test WebRTC translation handshake and secret parsing
        run: |
          swiftc Live/WebRTCTranslationProtocol.swift LiveTests/test_webrtc_translation_protocol.swift -o "$RUNNER_TEMP/webrtc-translation-tests"
          "$RUNNER_TEMP/webrtc-translation-tests"
      - name: Confirm WebRTC experiment isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          protocol = Path("Live/WebRTCTranslationExperiment.swift").read_text()
          contract = Path("Live/WebRTCTranslationProtocol.swift").read_text()
          view = Path("Live/WebRTCExperimentView.swift").read_text()
          app = Path("Live/LiveApp.swift").read_text()
          assert "/v1/realtime/translations/client_secrets" in contract
          assert "/v1/realtime/translations/calls" in contract
          assert 'RTCDataBuffer(' in protocol and '"session.close"' in protocol
          assert 'microphoneTrack?.isEnabled = false' in protocol
          assert 'microphoneTrack?.isEnabled = true' in protocol
          assert 'showWebRTCExperiment' in app and 'WebRTCExperimentView()' in app
          assert 'WebRTC' in Path("Live/project.yml").read_text()
          assert 'TranslationConnection()' in Path("Live/LiveSession.swift").read_text()
          routing = Path("Live/WebRTCTranslationExperiment.swift").read_text()
          assert "RTCAudioSession.sharedInstance()" in routing
          assert "rtc.lockForConfiguration()" in routing
          assert "rtc.overrideOutputAudioPort(.speaker)" in routing
          assert "guard !external" in routing and ".defaultToSpeaker" in routing
          assert "AVAudioSession.routeChangeNotification" in routing
          screen = Path("Live/WebRTCExperimentView.swift").read_text()
          assert 'engine.audioOutput' in screen
          print("WebRTC experiment isolated from production WebSocket mode")
          print("WebRTC speaker fallback and external-headphone safeguards validated")
          PY
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate completely separate Live project
        working-directory: Live
        run: xcodegen generate
      - name: Ensure legacy Swift and speech permissions are excluded
        run: |
          python3 - <<'PY'
          from pathlib import Path
          project = Path('Live/InterpreterLive.xcodeproj/project.pbxproj').read_text()
          for old in Path('App').glob('*.swift'):
              assert old.name not in project, old.name
          for path in Path('Live').glob('*.swift'):
              text = path.read_text()
              for legacy in ('import Speech', 'SFSpeechRecognizer'):
                  assert legacy not in text, (path, legacy)
          app = Path('Live/LiveApp.swift').read_text()
          transcription = Path('Live/TranscriptionFeature.swift').read_text()
          assert '.fileImporter(isPresented: $importing' not in app
          assert '.fileImporter(isPresented: $importing' not in transcription
          assert 'UIDocumentPickerViewController(' in transcription
          assert 'asCopy: true' in transcription
          voice_lab = Path('Live/LocalVoiceLab.swift').read_text()
          login = Path('Live/PlanOAuthFlow.swift').read_text()
          session = Path('Live/PlanCredentialVault.swift').read_text()
          api = Path('Live/ChatGPTPlanAPI.swift').read_text()
          assert 'chatgpt.tokens.use.direct' in login and 'resource.invoke' in login
          assert 'Interpreter Live iPhone' in login
          assert 'kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly' in session
          assert 'kSecAttrAccessGroup' not in session
          assert 'targetLanguage: String' in api and 'https://api.openai.com/v1/responses' in api
          assert 'ChatGPT' in voice_lab and 'needsTranslation' in voice_lab
          assert 'translatedSource == phrase && translatedLanguage == language' in voice_lab
          assert 'engine.speak(spoken, language: language)' in voice_lab
          policy = Path('Live/VoiceTextProcessingPolicy.swift').read_text()
          assert 'proofreading: Bool = false' in api
          assert 'VoiceTextProcessingPolicy.russianProofreadingInstructions' in api
          assert 'case proofreadRussian' in policy
          assert 'needsProofreading' in voice_lab and 'needsTextProcessing' in voice_lab
          assert 'translatedSource == phrase && translatedLanguage == language' in voice_lab
          assert 'translatedModel == chatModel' in voice_lab
          assert 'activeRequestID == requestID' in voice_lab
          assert 'Подключить ChatGPT для корректуры' in voice_lab
          assert 'Исходный текст' in voice_lab
          assert 'Исправленный текст' in voice_lab
          assert 'Озвучить оригинал без исправлений' in voice_lab
          assert 'Toggle("Исправлять русский перед озвучиванием"' in app
          assert 'live.russianProofreadingEnabled' in voice_lab
          print('Russian proofreading safeguards and manual review validated')
          print('Independent OAuth plan access and target-language translation validated')
          assert 'HomeFeatureTile(title: "Текст → голос"' in app
          assert 'HomeFeatureTile(title: "Голос → текст"' in app
          assert 'Section("Экспериментальный режим")' not in voice_lab
          assert 'VoiceSynthesisLanguage.supports(language)' in voice_lab
          assert 'HomeFeatureTile(title: "Текст → голос"' in app
          assert 'HomeFeatureTile(title: "Голос → текст"' in app
          assert 'HomeFeatureGlyph(kind: kind)' in app
          assert 'private struct HomeFeatureGlyph: View' in app
          assert 'case .speechToText:' in app and 'case .textToSpeech:' in app
          assert 'Color(white: 0.095)' in app
          print('Original graphite vector icons and compact home tiles validated')
          assert 'VoiceReferenceClip.prepare(referenceURL)' in voice_lab
          clip = Path('Live/VoiceReferenceClip.swift').read_text()
          assert 'maximumSeconds = 20.0' in clip
          assert 'AVAudioFile(forReading:' in clip
          assert 'AVAudioFile(' in clip and 'forWriting: temporaryURL' in clip
          print('Safe voice reference clipping before Core ML enabled')
          assert 'audio.record(forDuration: Self.recordingLimit)' in voice_lab
          assert 'recordingClock = Task' in voice_lab
          assert 'ProgressView(value: engine.recordingElapsed' in voice_lab
          assert '.scrollDismissesKeyboard(.interactively)' in voice_lab
          assert '@FocusState private var textEditorFocused' in voice_lab
          assert 'ToolbarItemGroup(placement: .keyboard)' not in voice_lab
          assert 'Button("Готово") { textEditorFocused = false }' not in voice_lab
          assert 'ToolbarItem(placement: .confirmationAction)' in voice_lab
          assert 'Button("Готово") {' in voice_lab
          assert 'LocalModelLoadingLine()' in voice_lab
          assert 'private struct LocalModelLoadingLine: View' in voice_lab
          assert 'TimelineView(.animation(' in voice_lab
          assert 'if engine.isSynthesizing {' in voice_lab
          assert '.safeAreaInset(edge: .bottom, spacing: 0)' not in voice_lab
          assert 'footer: {' in voice_lab
          assert 'Text("Chatterbox Multilingual · Core ML · локально на iPhone")' in voice_lab
          assert 'LocalSynthesisHeaderMotion()' in voice_lab
          assert 'Text("Состояние")' not in voice_lab
          assert 'Color.green.opacity' not in voice_lab
          assert 'ForEach(0..<17, id:' in voice_lab
          assert 'private struct LocalSynthesisHeaderMotion: View' in voice_lab
          assert 'if engine.isSynthesizing {' in voice_lab
          assert 'Button("Повторить аудио")' in voice_lab
          assert 'engine.replayLastAudio()' in voice_lab
          assert 'func replayLastAudio()' in voice_lab
          assert 'AVAudioPlayer(contentsOf: outputURL)' in voice_lab
          assert 'Button("Остановить воспроизведение")' not in voice_lab
          print('Scrolling unframed model attribution, header motion, and replayable WAV validated')
          print('Recording auto-stop, visible timer and keyboard dismissal wired')
          assert '@StateObject private var voiceLab = LocalVoiceLab()' in app
          assert 'LocalVoiceLabView(engine: voiceLab)' in app
          assert 'scheduleVoiceWarmup()' in app
          assert 'voiceLab.warmupIfAvailable()' in app
          assert 'ProcessInfo.processInfo.isLowPowerModeEnabled' in app
          assert 'Toggle("Подготавливать мой голос при запуске"' in app
          assert 'if !engine.hasVoice {' in voice_lab
          assert 'if engine.modelOnDisk {' in voice_lab
          assert 'self.removeOldReference()' in voice_lab
          assert 'LocalModelLoadingLine()' in voice_lab
          assert 'Chatterbox Multilingual · Core ML · локально на iPhone' in voice_lab
          assert 'live.voiceModelLoadedBefore' in voice_lab
          assert 'UserDefaults.standard.set(true' in voice_lab
          print('Shared cache warmup, model steps, clean voice form, and local model footer validated')
          print('Compact dual-action homepage and validated TTS languages')
          print('UIKit copy-mode document picker wired for both import paths')
          print('Fresh Live sources only; shared icon assets permitted')
          PY
      - name: Build simulator
        working-directory: Live
        run: |
          xcodebuild -project InterpreterLive.xcodeproj -scheme InterpreterLive -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build for iPhone
        working-directory: Live
        run: |
          xcodebuild -project InterpreterLive.xcodeproj -scheme InterpreterLive -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/LiveDevice" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verify app identity and package for Feather
        run: |
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          app = Path(os.environ['RUNNER_TEMP']) / 'LiveDevice/Build/Products/Release-iphoneos/InterpreterLive.app'
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          assert info['CFBundleIdentifier'] == 'org.interpreter.live'
          assert info['CFBundleShortVersionString'] == '1.4.19'
          assert info['CFBundleVersion'] == '29'
          assert 'NSSpeechRecognitionUsageDescription' not in info
          assert info['NSMicrophoneUsageDescription']
          print('Verified new app identity, microphone only')
          PY
          mkdir -p "$RUNNER_TEMP/live-ipa/Payload"
          cp -R "$RUNNER_TEMP/LiveDevice/Build/Products/Release-iphoneos/InterpreterLive.app" "$RUNNER_TEMP/live-ipa/Payload/"
          cd "$RUNNER_TEMP/live-ipa"
          zip -qry "$RUNNER_TEMP/Interpreter-Live-1.4.19-Experimental-Unsigned.ipa" Payload
          unzip -t "$RUNNER_TEMP/Interpreter-Live-1.4.19-Experimental-Unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: Interpreter-Live-1.4.19-Experimental-Unsigned-iPhone
          path: ${{ runner.temp }}/Interpreter-Live-1.4.19-Experimental-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7
