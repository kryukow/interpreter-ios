name: Interpreter iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: interpreter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test translation stream failures and completion
        run: |
          swiftc App/TranslationTextStream.swift scripts/test_translation_stream.swift -o "$RUNNER_TEMP/stream-tests"
          "$RUNNER_TEMP/stream-tests"
      - name: Test speech transcript across pauses
        run: |
          swiftc App/SpeechTranscript.swift scripts/test_speech_transcript.swift -o "$RUNNER_TEMP/speech-tests"
          "$RUNNER_TEMP/speech-tests"
      - name: Test realtime translation events and PCM playback
        run: |
          swiftc App/RealtimeProtocol.swift scripts/test_realtime_protocol.swift -o "$RUNNER_TEMP/realtime-tests"
          "$RUNNER_TEMP/realtime-tests"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test local audio budget
        run: |
          swiftc App/RealtimeProtocol.swift App/AudioBudget.swift scripts/test_audio_budget.swift -o "$RUNNER_TEMP/budget-tests"
          "$RUNNER_TEMP/budget-tests"
      - name: Verify XcodeGen
        run: xcodegen --version
      - name: Test playback silence at both edges
        run: |
          swiftc App/PlaybackClip.swift scripts/test_playback_clip.swift -o "$RUNNER_TEMP/playback-tests"
          "$RUNNER_TEMP/playback-tests"
      - name: Verify build tools
        run: xcodebuild -version
      - name: Test 200 ms microphone frames
        run: |
          swiftc App/PCMFrames.swift scripts/test_pcm_frames.swift -o "$RUNNER_TEMP/frame-tests"
          "$RUNNER_TEMP/frame-tests"
      - name: Verify build environment
        run: xcodegen --version
      - name: Generate project
        run: xcodegen generate
      - name: Build simulator
        run: |
          xcodebuild -project Interpreter.xcodeproj -scheme Interpreter -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build for iPhone
        run: |
          xcodebuild -project Interpreter.xcodeproj -scheme Interpreter -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/Device" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned IPA for signing in Feather
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Device/Build/Products/Release-iphoneos/Interpreter.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/Interpreter-0.4.5-Unsigned.ipa" Payload
          unzip -t "$RUNNER_TEMP/Interpreter-0.4.5-Unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: Interpreter-0.4.5-Unsigned-iPhone
          path: ${{ runner.temp }}/Interpreter-0.4.5-Unsigned.ipa
          if-no-files-found: error
          retention-days: 7
