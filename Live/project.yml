name: InterpreterLive
options:
  deploymentTarget:
    iOS: '18.4'
packages:
  ChatterboxCoreML:
    url: https://github.com/iliasaz/chatterbox-coreml.git
    revision: b8288834e783f3a6210757fbaf62f9014220bff9
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 153.0.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.4.20'
    CURRENT_PROJECT_VERSION: '30'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  InterpreterLive:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes: [project.yml, README.md]
      - path: ../App/Assets.xcassets
    dependencies:
      - package: ChatterboxCoreML
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.interpreter.live
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Interpreter Live
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Запись голоса для перевода через OpenAI.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
schemes:
  InterpreterLive:
    build:
      targets:
        InterpreterLive: all
