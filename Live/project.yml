name: InterpreterLive
options:
  deploymentTarget:
    iOS: '18.4'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.4.0'
    CURRENT_PROJECT_VERSION: '10'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  InterpreterLive:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes: [project.yml, README.md]
      - path: ../App/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.interpreter.live
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Interpreter Live
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Запись голоса для перевода через OpenAI.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
schemes:
  InterpreterLive:
    build:
      targets:
        InterpreterLive: all
